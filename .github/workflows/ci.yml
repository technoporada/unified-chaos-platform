# ============================================================================
# Unified Chaos Platform - CI/CD Pipeline
# ============================================================================
# Uruchamia się na:
# - Push do main/master
# - Pull request do main/master
# - Ręczny trigger (workflow_dispatch)
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# ============================================================================
# JOBS
# ============================================================================
jobs:

  # ------------------------------------------------------------------------
  # 1. LINT - Sprawdzenie składni i stylu kodu
  # ------------------------------------------------------------------------
  lint:
    name: 🔍 Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyflakes

      - name: Check Python syntax (pyflakes)
        run: |
          echo "=== Checking Python syntax ==="
          find . -name "*.py" -not -path "./.git/*" -exec python -m pyflakes {} \;
          echo "✅ Syntax check passed"

      - name: Check for common issues (flake8)
        run: |
          echo "=== Running flake8 ==="
          find . -name "*.py" -not -path "./.git/*" -exec flake8 \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics {} \;
          echo "✅ Lint check passed"

  # ------------------------------------------------------------------------
  # 2. TEST - Uruchomienie wszystkich testów
  # ------------------------------------------------------------------------
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets aiohttp

      - name: Run unit tests
        run: |
          echo "=== Running unit tests on Python ${{ matrix.python-version }} ==="
          python -m unittest test_chaos_platform.py -v
          echo "✅ All tests passed"

      - name: Verify all modules compile
        run: |
          echo "=== Verifying all Python modules ==="
          find . -name "*.py" -not -path "./.git/*" -exec python -m py_compile {} \;
          echo "✅ All modules compile successfully"

  # ------------------------------------------------------------------------
  # 3. SECURITY - Podstawowy audit bezpieczeństwa
  # ------------------------------------------------------------------------
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for hardcoded secrets
        run: |
          echo "=== Scanning for hardcoded secrets ==="
          # Check for common secret patterns
          if grep -rn "password\s*=\s*['\"]" --include="*.py" . | grep -v "test_" | grep -v "#"; then
            echo "⚠️  Warning: Possible hardcoded passwords found"
          else
            echo "✅ No hardcoded passwords found"
          fi

          if grep -rn "api_key\s*=\s*['\"]" --include="*.py" . | grep -v "test_" | grep -v "#"; then
            echo "⚠️  Warning: Possible hardcoded API keys found"
          else
            echo "✅ No hardcoded API keys found"
          fi

      - name: Check for unsafe socket binding
        run: |
          echo "=== Checking socket binding ==="
          if grep -rn "0\.0\.0\.0" --include="*.py" . | grep -v "#" | grep -v "test_"; then
            echo "⚠️  Warning: Found 0.0.0.0 binding (should use 127.0.0.1)"
            exit 1
          else
            echo "✅ No unsafe socket bindings found"
          fi

      - name: Check for bare except clauses
        run: |
          echo "=== Checking for bare except clauses ==="
          if grep -rn "except:" --include="*.py" . | grep -v "except Exception" | grep -v "except (" | grep -v "#"; then
            echo "⚠️  Warning: Found bare except clauses (should use except Exception)"
            exit 1
          else
            echo "✅ No bare except clauses found"
          fi

  # ------------------------------------------------------------------------
  # 4. BUILD - Przygotowanie artefaktów
  # ------------------------------------------------------------------------
  build:
    name: 📦 Build Artifacts
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create release archive
        run: |
          echo "=== Creating release archive ==="
          VERSION=$(grep -oP 'v\K[0-9.]+' README.md | head -1 || echo "1.0.0")
          ARCHIVE="UnifiedChaosPlatform-v${VERSION}.tar.gz"

          # Create archive excluding git and temp files
          tar -czf "$ARCHIVE" \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='chaos_server.log' \
            --exclude='.github' \
            --exclude="$ARCHIVE" \
            *

          echo "✅ Created: $ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedChaosPlatform
          path: "*.tar.gz"
          retention-days: 30

  # ------------------------------------------------------------------------
  # 5. NOTIFY - Powiadomienie o wyniku
  # ------------------------------------------------------------------------
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Pipeline result
        run: |
          echo "=========================================="
          echo "   CI/CD PIPELINE RESULT"
          echo "=========================================="
          echo ""
          echo "Lint:    ${{ needs.lint.result }}"
          echo "Test:    ${{ needs.test.result }}"
          echo "Security:${{ needs.security.result }}"
          echo "Build:   ${{ needs.build.result }}"
          echo ""
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ ALL CHECKS PASSED"
          else
            echo "❌ SOME CHECKS FAILED"
          fi
          echo "=========================================="
